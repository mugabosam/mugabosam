<svg xmlns="http://www.w3.org/2000/svg" width="800" height="128" viewBox="0 0 800 128" role="img" aria-label="Hi, I'm Sam. Software developer working in Python, machine learning and mobile.">
<defs>
  <linearGradient id="g" x1="0" x2="1">
    <stop offset="0" stop-color="#0ea5e9"/><stop offset=".5" stop-color="#6366f1"/><stop offset="1" stop-color="#0ea5e9"/>
  </linearGradient>
  <clipPath id="c"><rect x="0" y="104" width="180" height="4" rx="2"/></clipPath>
</defs>
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
  .name { font-size: 38px; font-weight: 700; fill: #0f172a; letter-spacing: -.5px; }
  .sub { font-size: 18px; fill: #475569; }
  .flow { animation: flow 6s linear infinite; }
  @keyframes flow { from { transform: translateX(-180px); } to { transform: translateX(0); } }

  .rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  .late { animation: fade .6s ease-out .35s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .rise, .late, .flow { animation: none; } }
</style>
<g class="rise">
  <text x="0" y="48" class="name">Hi, I'm Sam</text>
  <text x="0" y="84" class="sub">Software developer working in Python, machine learning and mobile.</text>
</g>
<g clip-path="url(#c)" class="late"><rect class="flow" x="0" y="104" width="360" height="4" fill="url(#g)"/></g>
</svg>
