<svg xmlns="http://www.w3.org/2000/svg" width="800" height="136" viewBox="0 0 800 136" role="img" aria-label="Zunga: Mobile-money payments in Rwanda without memorising USSD codes">
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
  .title { font-size: 23px; font-weight: 600; fill: #f1f5f9; }
  .tag { font-size: 16px; fill: #94a3b8; }
  .chip { font-size: 13.5px; fill: #7d8590; }
  .note { font-size: 13.5px; font-weight: 600; fill: #38bdf8; }

  .rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  .late { animation: fade .6s ease-out .35s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .rise, .late, .flow { animation: none; } }
</style>
<g class="rise">
  <rect x="1" y="1" width="798" height="134" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="1" y="22" width="3" height="92" rx="1.5" fill="#38bdf8"/>
  <text x="32" y="48" class="title">Zunga</text>
  <text x="32" y="77" class="tag">Mobile-money payments in Rwanda without memorising USSD codes</text>
  <circle cx="37" cy="108" r="5" fill="#00B4AB"/><text x="48" y="113" class="chip">Dart</text><circle cx="104" cy="108" r="5" fill="#A97BFF"/><text x="115" y="113" class="chip">Kotlin</text><circle cx="179" cy="108" r="5" fill="#2088ff"/><text x="190" y="113" class="chip">GitHub Actions</text>
  <text x="768" y="47" text-anchor="end" class="note late">Never touches the money</text>
</g>
</svg>
