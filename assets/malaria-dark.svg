<svg xmlns="http://www.w3.org/2000/svg" width="800" height="136" viewBox="0 0 800 136" role="img" aria-label="MalariaCheck: Malaria risk screening from 1,622 lab-confirmed hospital records">
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
  .title { font-size: 23px; font-weight: 600; fill: #f1f5f9; }
  .tag { font-size: 16px; fill: #94a3b8; }
  .chip { font-size: 13.5px; fill: #7d8590; }
  .note { font-size: 13.5px; font-weight: 600; fill: #38bdf8; }

  .rise { animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  .late { animation: fade .6s ease-out .35s both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .rise, .late, .flow { animation: none; } }
</style>
<g class="rise">
  <rect x="1" y="1" width="798" height="134" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="1" y="22" width="3" height="92" rx="1.5" fill="#38bdf8"/>
  <text x="32" y="48" class="title">MalariaCheck</text>
  <text x="32" y="77" class="tag">Malaria risk screening from 1,622 lab-confirmed hospital records</text>
  <circle cx="37" cy="108" r="5" fill="#3572A5"/><text x="48" y="113" class="chip">Python</text><circle cx="119" cy="108" r="5" fill="#f7931e"/><text x="130" y="113" class="chip">scikit-learn</text><circle cx="228" cy="108" r="5" fill="#ff4b4b"/><text x="239" y="113" class="chip">Streamlit</text>
  <text x="768" y="47" text-anchor="end" class="note late">88.9% accuracy · 89.1% sensitivity</text>
</g>
</svg>
